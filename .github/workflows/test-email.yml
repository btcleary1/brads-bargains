name: Test Email

on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Email address to send test to'
        required: false
        default: 'btcleary1@gmail.com'

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test digest email
        run: |
          STATUS=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 300 \
            "https://brads-bargains.vercel.app/api/digest?secret=${{ secrets.DIGEST_SECRET }}&force=1&mock=1&to=${{ github.event.inputs.to }}")
          echo "HTTP Status: $STATUS"
          cat /tmp/body.txt
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Digest endpoint returned HTTP $STATUS"
            exit 1
          fi
