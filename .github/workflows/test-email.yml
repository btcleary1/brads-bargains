name: Test Email

on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Email address to send test to'
        required: false
        default: 'btcleary1@gmail.com'

permissions:
  contents: read
  id-token: write   # lets the job get a GitHub-signed token the app checks (no shared password)

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test digest email
        env:
          TO: ${{ github.event.inputs.to }}
        run: |
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cleary-etrading-jobs" | jq -r .value)
          echo "::add-mask::$TOKEN"
          STATUS=$(curl -s -G -o /tmp/body.txt -w "%{http_code}" --max-time 300 \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "force=1" --data-urlencode "mock=1" --data-urlencode "to=$TO" \
            "https://brads-bargains.vercel.app/api/digest")
          echo "HTTP Status: $STATUS"
          cat /tmp/body.txt
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Digest endpoint returned HTTP $STATUS"
            exit 1
          fi
