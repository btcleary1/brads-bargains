name: Keepalive

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — keeps Vercel functions warm

permissions:
  actions: write             # needed to re-enable workflows below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deletion endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://brads-bargains.vercel.app/api/ebay-deletion")
          echo "Status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Endpoint returned HTTP $STATUS"
            exit 1
          fi

  # GitHub disables scheduled workflows after 60 days without repo activity.
  # Re-enabling a workflow through the API resets that timer, so doing it on
  # every run keeps the digest (and this workflow) scheduled indefinitely.
  workflow-keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in daily-digest.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "Re-enabled $wf"
          done
