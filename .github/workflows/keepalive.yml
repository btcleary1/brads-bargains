name: Keepalive

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — keeps Vercel functions warm

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deletion endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://brads-bargains.vercel.app/api/ebay-deletion")
          echo "Status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Endpoint returned HTTP $STATUS"
            exit 1
          fi
