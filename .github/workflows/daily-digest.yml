name: Daily Digest

on:
  schedule:
    - cron: '0 13 * * *'    # 9:00 AM EDT (Mar–Nov) / 8:00 AM EST (Nov–Mar)
  workflow_dispatch:         # allows manual trigger from GitHub Actions tab
    inputs:
      force:
        description: 'Force send even if digest already ran today (true/false)'
        required: false
        default: 'false'
      to:
        description: 'Override recipient email address (leave blank for configured recipients)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write   # lets the job get a GitHub-signed token the app checks (no shared password)

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest
        env:
          FORCE: ${{ github.event.inputs.force }}
          TO: ${{ github.event.inputs.to }}
        run: |
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cleary-etrading-jobs" | jq -r .value)
          echo "::add-mask::$TOKEN"
          URL="https://brads-bargains.vercel.app/api/digest"
          ARGS=()
          if [ "$FORCE" = "true" ]; then
            ARGS+=(--data-urlencode "force=1")
          fi
          if [ -n "$TO" ]; then
            ARGS+=(--data-urlencode "to=$TO")
          fi
          STATUS=$(curl -s -G -o /tmp/body.txt -w "%{http_code}" --max-time 300 \
            -H "Authorization: Bearer $TOKEN" "${ARGS[@]}" "$URL")
          cat /tmp/body.txt
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Digest endpoint returned HTTP $STATUS — failing job"
            exit 1
          fi
